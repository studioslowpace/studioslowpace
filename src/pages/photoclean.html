<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SwipeClean 相簿整理</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1f2421;
      --muted: #68706a;
      --accent: #2c6e49;
      --danger: #c92a2a;
      --border: #e2dfd7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 10;
    }

    .stats {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats strong {
      color: var(--text);
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-danger-outline {
      color: var(--danger);
      border-color: #ffc9c9;
      background: #fff5f5;
    }

    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 540px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      touch-action: none;
      transition: transform 0.18s ease-out, opacity 0.18s ease-out;
    }

    .card.dragging {
      transition: none;
    }

    .card img {
      width: 100%;
      flex: 1;
      object-fit: cover;
      background: #eae7e1;
      pointer-events: none;
    }

    .card-meta {
      padding: 12px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .badge {
      position: absolute;
      top: 20px;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 1px;
      opacity: 0;
      pointer-events: none;
      border: 2px solid currentColor;
      background: rgba(255, 255, 255, 0.9);
    }

    .badge-delete {
      left: 50%;
      transform: translateX(-50%);
      color: var(--danger);
    }

    .badge-prev {
      left: 18px;
      color: var(--accent);
    }

    .badge-next {
      right: 18px;
      color: #1971c2;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }

    .albums-bar {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
    }

    .album-chip {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #faf9f6;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .album-chip:active {
      background: #e6fcf5;
      border-color: var(--accent);
    }

    .bottom-actions {
      background: var(--card);
      padding: 8px 14px 14px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      max-height: 75vh;
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pending-list {
      overflow-y: auto;
      flex: 1;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      font-size: 13px;
    }

    .pending-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed #eee;
    }

    #toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 28, 26, 0.9);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 40;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <header>
    <div class="stats">
      <span>待整理：<strong id="statRemain">0</strong></span>
      <span>已存新檔：<strong id="statSaved">0</strong></span>
      <span>待刪：<strong id="statDelete">0</strong></span>
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">選取照片</button>
    <input id="fileInput" type="file" accept="image/*" multiple hidden />
  </header>

  <main id="stage">
    <div class="empty-state" id="emptyState">
      <p><strong>尚未載入照片</strong></p>
      <p>點擊右上角「選取照片」匯入相片，即可開始滑動整理。</p>
      <p style="font-size:12px;">向上滑動：放入待刪清單｜左右滑動：切換照片</p>
    </div>
  </main>

  <div class="albums-bar" id="albumsBar">
    <!-- 動態產生相簿按鈕 -->
  </div>

  <div class="bottom-actions">
    <button class="btn" onclick="addAlbum()">＋ 新增相簿</button>
    <button class="btn btn-danger-outline" onclick="openPendingModal()">待刪清單 (<span id="pendingCountBtn">0</span>)</button>
  </div>

  <!-- 待刪清單視窗 -->
  <div class="modal" id="pendingModal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>待刪照片清單（需自行於系統相簿刪除）</strong>
        <button class="btn" onclick="closePendingModal()">關閉</button>
      </div>
      <div class="pending-list" id="pendingList"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn" onclick="clearPending()">清空清單</button>
        <button class="btn btn-primary" onclick="exportPendingList()">匯出待刪清單檔</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const ALBUMS = ["精選收藏", "旅遊紀錄", "工作資料", "生活日常"];
    let photos = [];        // { id, name, dataUrl, status: 'pending' | 'saved' | 'to_delete', album: string | null }
    let currentIndex = 0;
    let savedCount = 0;
    let pendingDelete = []; // { id, name, timestamp }

    const stage = document.getElementById("stage");
    const emptyState = document.getElementById("emptyState");
    const fileInput = document.getElementById("fileInput");

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function hasNativeBridge() {
      return typeof window.AndroidBridge !== "undefined";
    }

    function renderAlbumsBar() {
      const bar = document.getElementById("albumsBar");
      bar.innerHTML = "";
      ALBUMS.forEach((album) => {
        const chip = document.createElement("button");
        chip.className = "album-chip";
        chip.textContent = `存至「${album}」`;
        chip.onclick = () => saveCurrentToAlbum(album);
        bar.appendChild(chip);
      });
    }

    function addAlbum() {
      const name = prompt("請輸入新相簿名稱：");
      if (!name) return;
      const trimmed = name.trim();
      if (!trimmed) return;
      if (!ALBUMS.includes(trimmed)) {
        ALBUMS.push(trimmed);
        renderAlbumsBar();
      }
      showToast(`已新增相簿「${trimmed}」`);
    }

    fileInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      for (const file of files) {
        const dataUrl = await readFileAsDataUrl(file);
        photos.push({
          id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          name: file.name || `photo_${photos.length + 1}.jpg`,
          dataUrl,
          status: "pending",
          album: null
        });
      }
      fileInput.value = "";
      if (currentIndex >= photos.length) currentIndex = 0;
      renderCard();
      updateStats();
      showToast(`已載入 ${files.length} 張照片`);
    });

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function getActivePhotos() {
      return photos.filter((p) => p.status === "pending");
    }

    function updateStats() {
      const remain = getActivePhotos().length;
      document.getElementById("statRemain").textContent = remain;
      document.getElementById("statSaved").textContent = savedCount;
      document.getElementById("statDelete").textContent = pendingDelete.length;
      document.getElementById("pendingCountBtn").textContent = pendingDelete.length;
    }

    function renderCard() {
      // 移除舊卡片
      const oldCard = stage.querySelector(".card");
      if (oldCard) oldCard.remove();

      const active = getActivePhotos();
      if (!active.length) {
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";
      if (currentIndex < 0) currentIndex = active.length - 1;
      if (currentIndex >= active.length) currentIndex = 0;

      const item = active[currentIndex];
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="badge badge-delete" id="badgeDelete">加入待刪</div>
        <div class="badge badge-prev" id="badgePrev">上一張</div>
        <div class="badge badge-next" id="badgeNext">下一張</div>
        <img src="${item.dataUrl}" alt="${item.name}" />
        <div class="card-meta">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;">${item.name}</span>
          <span>${currentIndex + 1} / ${active.length}</span>
        </div>
      `;

      attachSwipeEvents(card, item);
      stage.appendChild(card);
    }

    function attachSwipeEvents(card, item) {
      let startX = 0;
      let startY = 0;
      let dx = 0;
      let dy = 0;
      let isDragging = false;

      const badgeDelete = card.querySelector("#badgeDelete");
      const badgePrev = card.querySelector("#badgePrev");
      const badgeNext = card.querySelector("#badgeNext");

      const onStart = (clientX, clientY) => {
        isDragging = true;
        startX = clientX;
        startY = clientY;
        dx = 0;
        dy = 0;
        card.classList.add("dragging");
      };

      const onMove = (clientX, clientY) => {
        if (!isDragging) return;
        dx = clientX - startX;
        dy = clientY - startY;
        const rot = dx * 0.04;
        card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;

        badgeDelete.style.opacity = dy < -40 ? Math.min(1, (-dy - 40) / 70) : 0;
        badgeNext.style.opacity = dx < -40 ? Math.min(1, (-dx - 40) / 70) : 0;
        badgePrev.style.opacity = dx > 40 ? Math.min(1, (dx - 40) / 70) : 0;
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        card.classList.remove("dragging");

        // 向上滑動超過 110px -> 加入待刪
        if (dy < -110 && Math.abs(dy) > Math.abs(dx)) {
          card.style.transform = `translate(${dx}px, -650px) rotate(${dx * 0.05}deg)`;
          card.style.opacity = "0";
          setTimeout(() => markPendingDelete(item), 160);
          return;
        }

        // 向左滑動超過 90px -> 下一張
        if (dx < -90) {
          currentIndex += 1;
          renderCard();
          return;
        }

        // 向右滑動超過 90px -> 上一張
        if (dx > 90) {
          currentIndex -= 1;
          renderCard();
          return;
        }

        // 復位
        card.style.transform = "";
        badgeDelete.style.opacity = 0;
        badgePrev.style.opacity = 0;
        badgeNext.style.opacity = 0;
      };

      card.addEventListener("touchstart", (e) => {
        const t = e.touches[0];
        onStart(t.clientX, t.clientY);
      }, { passive: true });

      card.addEventListener("touchmove", (e) => {
        const t = e.touches[0];
        onMove(t.clientX, t.clientY);
      }, { passive: true });

      card.addEventListener("touchend", onEnd);

      // 滑鼠支援（方便桌面測試）
      card.addEventListener("mousedown", (e) => onStart(e.clientX, e.clientY));
      window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
      window.addEventListener("mouseup", onEnd);
    }

    function saveCurrentToAlbum(albumName) {
      const active = getActivePhotos();
      if (!active.length) return;
      const item = active[currentIndex];
      item.status = "saved";
      item.album = albumName;
      savedCount += 1;

      if (hasNativeBridge()) {
        try {
          const result = window.AndroidBridge.savePhotoToAlbum(albumName, item.name, item.dataUrl);
          showToast(result || `已另存至「${albumName}」`);
        } catch (err) {
          showToast("另存時發生錯誤");
        }
      } else {
        showToast(`已分類至「${albumName}」（預覽模式）`);
      }

      updateStats();
      renderCard();
    }

    function markPendingDelete(item) {
      item.status = "to_delete";
      const record = {
        id: item.id,
        name: item.name,
        time: new Date().toLocaleString()
      };
      pendingDelete.push(record);

      if (hasNativeBridge()) {
        try {
          window.AndroidBridge.recordPendingDelete(item.name);
        } catch (err) {}
      }

      showToast(`已加入待刪：${item.name}`);
      updateStats();
      renderCard();
    }

    function openPendingModal() {
      const list = document.getElementById("pendingList");
      if (!pendingDelete.length) {
        list.innerHTML = `<p style="color:#888;text-align:center;">目前沒有待刪照片</p>`;
      } else {
        list.innerHTML = pendingDelete
          .map((p, idx) => `
            <div class="pending-item">
              <span>${idx + 1}. <strong>${p.name}</strong><br><small style="color:#888;">${p.time}</small></span>
              <button class="btn" onclick="restorePending(${idx})">取消待刪</button>
            </div>
          `)
          .join("");
      }
      document.getElementById("pendingModal").classList.add("open");
    }

    function closePendingModal() {
      document.getElementById("pendingModal").classList.remove("open");
    }

    function restorePending(idx) {
      const removed = pendingDelete.splice(idx, 1)[0];
      const target = photos.find((p) => p.id === removed.id);
      if (target) {
        target.status = "pending";
      }
      updateStats();
      renderCard();
      openPendingModal();
    }

    function clearPending() {
      pendingDelete.forEach((p) => {
        const target = photos.find((item) => item.id === p.id);
        if (target && target.status === "to_delete") {
          target.status = "pending";
        }
      });
      pendingDelete = [];
      updateStats();
      renderCard();
      openPendingModal();
    }

    function exportPendingList() {
      if (!pendingDelete.length) {
        showToast("待刪清單為空");
        return;
      }
      const content = pendingDelete.map((p, i) => `${i + 1}. ${p.name} (${p.time})`).join("\n");
      if (hasNativeBridge()) {
        const msg = window.AndroidBridge.exportPendingListFile(content);
        showToast(msg || "已匯出待刪清單");
      } else {
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pending_delete_list.txt";
        a.click();
        URL.revokeObjectURL(url);
      }
    }

    renderAlbumsBar();
    updateStats();
  </script>
</body>
</html>
