<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SwipeClean - 相簿滑動整理 App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent dynamic dynamic scrolling and text selection during swipe */
    body {
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background-color: #0f172a;
    }
    
    .card-shadow {
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5), 0 10px 15px -5px rgba(0, 0, 0, 0.3);
    }

    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .glass-btn:active {
      transform: scale(0.95);
    }

    /* Custom scrollbar for modals */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="text-slate-100 font-sans h-screen flex flex-col justify-between select-none overflow-hidden">

  <!-- Top App Navigation / Header Bar -->
  <header class="w-full px-4 pt-4 pb-2 z-20 max-w-md mx-auto">
    <div class="glass-panel rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center shadow-md">
          <i class="fa-solid font-bold fa-fire text-white text-lg"></i>
        </div>
        <span class="font-extrabold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">SwipeClean</span>
      </div>
      
      <!-- Counters & Actions -->
      <div class="flex items-center space-x-2">
        <button id="btnOpenAlbums" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1.5 hover:bg-slate-700/50 transition">
          <i class="fa-solid fa-folder-closed text-indigo-400"></i>
          <span id="albumCountBadge" class="text-slate-200">0</span>
        </button>

        <button id="btnOpenTrash" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1.5 hover:bg-slate-700/50 transition relative">
          <i class="fa-solid fa-trash-can text-rose-400"></i>
          <span id="trashCountBadge" class="text-slate-200">0</span>
        </button>
        
        <label for="fileUploadInput" class="glass-btn cursor-pointer p-2 rounded-xl text-xs font-semibold flex items-center justify-center text-indigo-300 hover:bg-slate-700/50 transition" title="上傳照片">
          <i class="fa-solid fa-cloud-arrow-up text-base"></i>
        </label>
        <input type="file" id="fileUploadInput" accept="image/*" multiple class="hidden">
      </div>
    </div>
  </header>

  <!-- Progress Bar & Status -->
  <div class="w-full max-w-md mx-auto px-6 py-1 flex items-center justify-between text-xs text-slate-400 z-10">
    <div class="flex items-center space-x-1">
      <i class="fa-regular fa-images text-indigo-400"></i>
      <span>剩餘待整理：<strong id="remainingCounter" class="text-white font-bold">0</strong></span>
    </div>
    <div class="text-xs text-slate-500">
      ↑ 向上滑動標記刪除
    </div>
  </div>

  <!-- Main Card Stack Container -->
  <main class="relative flex-1 w-full max-w-md mx-auto px-4 py-2 flex items-center justify-center z-10 overflow-hidden">
    
    <!-- Gesture Overlay Labels -->
    <div id="badgeDelete" class="absolute top-10 z-30 pointer-events-none opacity-0 transform -translate-y-4 transition-all duration-150 flex items-center space-x-2 bg-rose-500/90 text-white font-extrabold px-6 py-2 rounded-full shadow-2xl border border-rose-300/40 text-lg uppercase tracking-wider">
      <i class="fa-solid fa-trash-can"></i>
      <span>標記刪除</span>
    </div>

    <div id="badgeNext" class="absolute right-8 top-1/2 -translate-y-1/2 z-30 pointer-events-none opacity-0 transform translate-x-4 transition-all duration-150 flex items-center space-x-2 bg-indigo-500/90 text-white font-extrabold px-5 py-3 rounded-2xl shadow-2xl border border-indigo-300/40 text-base">
      <span>下一張</span>
      <i class="fa-solid fa-chevron-right"></i>
    </div>

    <div id="badgePrev" class="absolute left-8 top-1/2 -translate-y-1/2 z-30 pointer-events-none opacity-0 transform -translate-x-4 transition-all duration-150 flex items-center space-x-2 bg-slate-600/90 text-white font-extrabold px-5 py-3 rounded-2xl shadow-2xl border border-slate-300/40 text-base">
      <i class="fa-solid fa-chevron-left"></i>
      <span>上一張</span>
    </div>

    <!-- Empty State Screen -->
    <div id="emptyState" class="hidden flex-col items-center justify-center text-center p-8 glass-panel rounded-3xl w-full h-[75vh] max-h-[560px] border border-slate-700/50 shadow-2xl">
      <div class="w-20 h-20 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center mb-4 text-indigo-400 text-3xl animate-bounce">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h3 class="text-xl font-extrabold text-white mb-2">相簿整理完成！</h3>
      <p class="text-slate-400 text-sm mb-6 max-w-xs leading-relaxed">太棒了，所有圖片皆已處理完畢。你可以匯入新照片或檢查垃圾桶。</p>
      
      <div class="flex flex-col space-y-3 w-full max-w-xs">
        <label for="fileUploadInput2" class="cursor-pointer bg-gradient-to-r from-indigo-500 to-rose-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-plus"></i>
          <span>上傳手機本地照片</span>
        </label>
        <input type="file" id="fileUploadInput2" accept="image/*" multiple class="hidden">

        <button id="btnResetDemo" class="glass-btn text-slate-300 font-semibold py-2.5 px-4 rounded-xl hover:bg-slate-700/60 transition text-sm flex items-center justify-center space-x-2">
          <i class="fa-solid fa-rotate-left"></i>
          <span>重新載入範例圖庫</span>
        </button>
      </div>
    </div>

    <!-- Dynamic Card Stack Container -->
    <div id="cardContainer" class="relative w-full h-[72vh] max-h-[580px] flex items-center justify-center">
      <!-- Cards rendered via JavaScript dynamically -->
    </div>
  </main>

  <!-- Quick Album Categorization Dock (Bottom Toolbar) -->
  <footer class="w-full max-w-md mx-auto px-4 pb-6 pt-2 z-20">
    <div class="glass-panel rounded-3xl p-3 shadow-2xl border border-slate-700/60 flex flex-col space-y-2">
      <div class="flex items-center justify-between px-2 pt-1">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">一鍵歸檔至相簿</span>
        <button id="btnCreateAlbum" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 flex items-center space-x-1">
          <i class="fa-solid fa-plus text-[10px]"></i>
          <span>新增相簿</span>
        </button>
      </div>

      <!-- Scrollable Album Quick Buttons -->
      <div id="albumDock" class="flex items-center space-x-2 overflow-x-auto pb-1 pt-1 no-scrollbar px-1">
        <!-- Rendered by JS -->
      </div>
    </div>
  </footer>

  <!-- Toast Floating Notification -->
  <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 bg-slate-900/90 border border-slate-700 text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center space-x-2 text-sm font-medium">
    <i id="toastIcon" class="fa-solid fa-circle-info text-indigo-400"></i>
    <span id="toastMsg">提示訊息</span>
  </div>

  <!-- MODAL 1: Trash Manager -->
  <div id="modalTrash" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex-col justify-end sm:justify-center items-center p-0 sm:p-4 transition-opacity">
    <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-md h-[85vh] sm:h-[680px] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-200">
      <!-- Modal Header -->
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-rose-500/20 text-rose-400 flex items-center justify-center">
            <i class="fa-solid fa-trash-can text-sm"></i>
          </div>
          <div>
            <h3 class="font-bold text-white leading-tight">回收桶</h3>
            <p class="text-xs text-slate-400">已標記待刪除的照片</p>
          </div>
        </div>
        <button class="btnCloseModal text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-800">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Trash Grid -->
      <div id="trashGrid" class="flex-1 overflow-y-auto p-4 grid grid-cols-3 gap-2 align-content-start">
        <!-- Items added dynamically -->
      </div>

      <!-- Trash Footer Actions -->
      <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex items-center justify-between space-x-3">
        <button id="btnRestoreAll" class="flex-1 glass-btn py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition">
          全部還原
        </button>
        <button id="btnClearTrash" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-rose-950 transition">
          永久刪除全部
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: Albums View -->
  <div id="modalAlbums" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex-col justify-end sm:justify-center items-center p-0 sm:p-4 transition-opacity">
    <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-md h-[85vh] sm:h-[680px] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
            <i class="fa-solid fa-folder-open text-sm"></i>
          </div>
          <div>
            <h3 class="font-bold text-white leading-tight">分類相簿集</h3>
            <p class="text-xs text-slate-400">已分類照片預覽</p>
          </div>
        </div>
        <button class="btnCloseModal text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-800">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Album Selector Tabs -->
      <div id="albumTabs" class="flex items-center space-x-2 px-4 py-3 border-b border-slate-800 overflow-x-auto no-scrollbar">
        <!-- Rendered by JS -->
      </div>

      <!-- Album Photos Grid -->
      <div id="albumGrid" class="flex-1 overflow-y-auto p-4 grid grid-cols-3 gap-2 align-content-start">
        <!-- Renders pictures inside active album -->
      </div>
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    // --- Sample Default Photos ---
    const INITIAL_PHOTOS = [
      { id: '1', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80', title: '陽光海灘景色', albumId: null, isDeleted: false },
      { id: '2', url: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80', title: '壯麗星空雪山', albumId: null, isDeleted: false },
      { id: '3', url: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80', title: '清晨晨霧森林', albumId: null, isDeleted: false },
      { id: '4', url: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80', title: '極光奇幻夜空', albumId: null, isDeleted: false },
      { id: '5', url: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80', title: '人像攝影特寫', albumId: null, isDeleted: false },
      { id: '6', url: 'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=800&q=80', title: '精緻美饌料理', albumId: null, isDeleted: false },
      { id: '7', url: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80', title: '質感科技手機', albumId: null, isDeleted: false }
    ];

    // --- Initial Albums ---
    let albums = [
      { id: 'favorites', name: '精選收藏', icon: 'fa-heart', color: 'bg-rose-500' },
      { id: 'travel', name: '旅遊記憶', icon: 'fa-plane', color: 'bg-emerald-500' },
      { id: 'work', name: '工作文件', icon: 'fa-briefcase', color: 'bg-blue-500' },
      { id: 'family', name: '家庭生活', icon: 'fa-house-user', color: 'bg-amber-500' }
    ];

    // App State
    let photos = [...INITIAL_PHOTOS];
    let currentIndex = 0;
    let selectedAlbumTab = 'favorites';

    // DOM Elements
    const cardContainer = document.getElementById('cardContainer');
    const emptyState = document.getElementById('emptyState');
    const albumDock = document.getElementById('albumDock');
    const remainingCounter = document.getElementById('remainingCounter');
    const trashCountBadge = document.getElementById('trashCountBadge');
    const albumCountBadge = document.getElementById('albumCountBadge');
    const badgeDelete = document.getElementById('badgeDelete');
    const badgeNext = document.getElementById('badgeNext');
    const badgePrev = document.getElementById('badgePrev');

    // Init App
    window.onload = () => {
      renderAlbumDock();
      renderStack();
      updateCounters();
      setupFileUploadListeners();
      setupModalListeners();
    };

    // --- Helper: Get active unsorted photos ---
    function getPendingPhotos() {
      return photos.filter(p => !p.isDeleted && p.albumId === null);
    }

    // --- Update Counters & Badges ---
    function updateCounters() {
      const pending = getPendingPhotos();
      const trash = photos.filter(p => p.isDeleted);
      const categorized = photos.filter(p => p.albumId !== null && !p.isDeleted);

      remainingCounter.textContent = pending.length;
      trashCountBadge.textContent = trash.length;
      albumCountBadge.textContent = categorized.length;

      if (pending.length === 0) {
        cardContainer.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        cardContainer.classList.remove('hidden');
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }
    }

    // --- Toast Notification System ---
    let toastTimeout;
    function showToast(message, iconClass = 'fa-circle-info', colorClass = 'text-indigo-400') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = message;
      toastIcon.className = `fa-solid ${iconClass} ${colorClass}`;

      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', '-translate-y-2');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', '-translate-y-2');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2000);
    }

    // --- Render Card Stack ---
    function renderStack() {
      cardContainer.innerHTML = '';
      const pending = getPendingPhotos();

      if (pending.length === 0) {
        updateCounters();
        return;
      }

      // Ensure index boundary safety
      if (currentIndex >= pending.length) {
        currentIndex = Math.max(0, pending.length - 1);
      }

      // We render current photo and the next 2 stacked photos behind it
      const visibleCount = Math.min(3, pending.length - currentIndex);

      for (let i = visibleCount - 1; i >= 0; i--) {
        const photoIdx = currentIndex + i;
        if (photoIdx >= pending.length) continue;

        const photo = pending[photoIdx];
        const card = document.createElement('div');
        card.dataset.id = photo.id;
        
        // Base styling for cards
        card.className = `absolute inset-0 w-full h-full rounded-3xl overflow-hidden glass-panel border border-slate-700/60 card-shadow transition-transform duration-200 select-none cursor-grab active:cursor-grabbing flex flex-col`;
        
        // Stack depth effect
        const scale = 1 - i * 0.05;
        const translateY = i * 14;
        const opacity = 1 - i * 0.2;
        card.style.transform = `translateY(${translateY}px) scale(${scale})`;
        card.style.zIndex = 10 - i;
        card.style.opacity = opacity;

        card.innerHTML = `
          <div class="relative flex-1 w-full bg-slate-950 overflow-hidden">
            <img src="${photo.url}" alt="${photo.title}" class="w-full h-full object-cover pointer-events-none" onerror="this.src='https://placehold.co/600x800/1e293b/fff?text=圖片載入失敗'">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-black/30"></div>
            
            <div class="absolute top-4 left-4 glass-btn px-3 py-1 rounded-full text-xs font-semibold text-slate-200 backdrop-blur-md">
              # ${photoIdx + 1} / ${pending.length}
            </div>
          </div>
          <div class="p-4 bg-slate-900/90 backdrop-blur-md flex items-center justify-between border-t border-slate-800">
            <div>
              <h4 class="font-bold text-white text-base leading-snug">${photo.title}</h4>
              <p class="text-xs text-slate-400">滑動手勢：向上刪除 ‧ 左右切換</p>
            </div>
          </div>
        `;

        cardContainer.appendChild(card);

        // Attach Swipe Events to top active card only
        if (i === 0) {
          attachSwipeGesture(card, photo);
        }
      }

      updateCounters();
    }

    // --- Gesture Handling Logic (Touch + Mouse Drag) ---
    function attachSwipeGesture(card, photo) {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      let isDragging = false;

      const onStart = (x, y) => {
        isDragging = true;
        startX = x;
        startY = y;
        card.style.transition = 'none';
      };

      const onMove = (x, y) => {
        if (!isDragging) return;
        currentX = x - startX;
        currentY = y - startY;

        // Apply translation & rotation
        const rotate = currentX * 0.05;
        card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

        // Visual Feedback Indicators
        if (currentY < -60 && Math.abs(currentY) > Math.abs(currentX)) {
          // Swipe Up -> Delete
          badgeDelete.style.opacity = Math.min(1, Math.abs(currentY) / 120);
          badgeNext.style.opacity = 0;
          badgePrev.style.opacity = 0;
        } else if (currentX > 50) {
          // Swipe Right -> Prev
          badgePrev.style.opacity = Math.min(1, currentX / 120);
          badgeNext.style.opacity = 0;
          badgeDelete.style.opacity = 0;
        } else if (currentX < -50) {
          // Swipe Left -> Next
          badgeNext.style.opacity = Math.min(1, Math.abs(currentX) / 120);
          badgePrev.style.opacity = 0;
          badgeDelete.style.opacity = 0;
        } else {
          badgeDelete.style.opacity = 0;
          badgeNext.style.opacity = 0;
          badgePrev.style.opacity = 0;
        }
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        
        // Reset Overlays
        badgeDelete.style.opacity = 0;
        badgeNext.style.opacity = 0;
        badgePrev.style.opacity = 0;

        const thresholdX = 100;
        const thresholdY = 120;

        // Action Trigger Decisions
        if (currentY < -thresholdY && Math.abs(currentY) > Math.abs(currentX)) {
          // SWIPE UP: Mark Photo as Deleted
          animateCardOut(card, 0, -600, () => {
            photo.isDeleted = true;
            showToast('已移至回收桶', 'fa-trash-can', 'text-rose-400');
            renderStack();
          });
        } else if (currentX < -thresholdX) {
          // SWIPE LEFT: Next Photo
          const pending = getPendingPhotos();
          if (currentIndex < pending.length - 1) {
            animateCardOut(card, -500, 0, () => {
              currentIndex++;
              renderStack();
            });
          } else {
            resetCardPosition(card);
            showToast('已經是最後一張照片了', 'fa-circle-exclamation', 'text-amber-400');
          }
        } else if (currentX > thresholdX) {
          // SWIPE RIGHT: Previous Photo
          if (currentIndex > 0) {
            animateCardOut(card, 500, 0, () => {
              currentIndex--;
              renderStack();
            });
          } else {
            resetCardPosition(card);
            showToast('已經是第一張照片了', 'fa-circle-exclamation', 'text-amber-400');
          }
        } else {
          // Reset if threshold not reached
          resetCardPosition(card);
        }
      };

      // Mouse Events
      card.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', onEnd);

      // Touch Events
      card.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        onStart(touch.clientX, touch.clientY);
      }, { passive: true });

      card.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        onMove(touch.clientX, touch.clientY);
      }, { passive: true });

      card.addEventListener('touchend', onEnd);
    }

    function animateCardOut(card, targetX, targetY, callback) {
      card.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
      card.style.transform = `translate(${targetX}px, ${targetY}px) rotate(${targetX * 0.1}deg)`;
      card.style.opacity = '0';
      setTimeout(callback, 280);
    }

    function resetCardPosition(card) {
      card.style.transition = 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      card.style.transform = 'translate(0px, 0px) rotate(0deg)';
    }

    // --- Quick Album Dock Rendering & Interactions ---
    function renderAlbumDock() {
      albumDock.innerHTML = '';
      albums.forEach(album => {
        const btn = document.createElement('button');
        btn.className = `glass-btn flex-shrink-0 px-3.5 py-2 rounded-2xl flex items-center space-x-2 text-xs font-bold text-slate-200 hover:text-white transition active:scale-95 border border-slate-700/80 hover:border-slate-500`;
        btn.innerHTML = `
          <div class="w-6 h-6 rounded-lg ${album.color} flex items-center justify-center text-white text-[10px] shadow">
            <i class="fa-solid ${album.icon}"></i>
          </div>
          <span>${album.name}</span>
        `;

        btn.addEventListener('click', () => assignCurrentPhotoToAlbum(album));
        albumDock.appendChild(btn);
      });
    }

    // --- Categorize Current Photo to Album ---
    function assignCurrentPhotoToAlbum(album) {
      const pending = getPendingPhotos();
      if (pending.length === 0) return;

      const currentPhoto = pending[currentIndex];
      currentPhoto.albumId = album.id;

      // Animate card out with subtle effect
      const topCard = cardContainer.firstElementChild;
      if (topCard) {
        animateCardOut(topCard, 0, 400, () => {
          showToast(`已分類至「${album.name}」`, album.icon, 'text-emerald-400');
          renderStack();
        });
      } else {
        renderStack();
      }
    }

    // --- Add New Custom Album ---
    document.getElementById('btnCreateAlbum').addEventListener('click', () => {
      const albumName = prompt('請輸入新相簿名稱：');
      if (albumName && albumName.trim() !== '') {
        const colors = ['bg-purple-500', 'bg-pink-500', 'bg-cyan-500', 'bg-orange-500', 'bg-teal-500'];
        const icons = ['fa-star', 'fa-bookmark', 'fa-camera', 'fa-image', 'fa-heart-circle-check'];
        
        const newAlbum = {
          id: 'album_' + Date.now(),
          name: albumName.trim(),
          icon: icons[Math.floor(Math.random() * icons.length)],
          color: colors[Math.floor(Math.random() * colors.length)]
        };

        albums.push(newAlbum);
        renderAlbumDock();
        showToast(`已建立「${newAlbum.name}」相簿`, newAlbum.icon, 'text-indigo-400');
      }
    });

    // --- Support Local File Uploads ---
    function setupFileUploadListeners() {
      const handleFiles = (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        let addedCount = 0;
        Array.from(files).forEach((file, index) => {
          if (file.type.startsWith('image/')) {
            const url = URL.createObjectURL(file);
            photos.unshift({
              id: 'user_' + Date.now() + '_' + index,
              url: url,
              title: file.name.replace(/\.[^/.]+$/, ""),
              albumId: null,
              isDeleted: false
            });
            addedCount++;
          }
        });

        if (addedCount > 0) {
          currentIndex = 0;
          renderStack();
          showToast(`成功匯入 ${addedCount} 張新照片！`, 'fa-cloud-arrow-up', 'text-emerald-400');
        }
      };

      document.getElementById('fileUploadInput').addEventListener('change', handleFiles);
      document.getElementById('fileUploadInput2').addEventListener('change', handleFiles);

      document.getElementById('btnResetDemo').addEventListener('click', () => {
        photos = INITIAL_PHOTOS.map(p => ({ ...p, albumId: null, isDeleted: false }));
        currentIndex = 0;
        renderStack();
        showToast('已重新載入預設圖庫', 'fa-rotate-left', 'text-indigo-400');
      });
    }

    // --- Modal Management & Views ---
    function setupModalListeners() {
      const modalTrash = document.getElementById('modalTrash');
      const modalAlbums = document.getElementById('modalAlbums');

      // Open Trash Modal
      document.getElementById('btnOpenTrash').addEventListener('click', () => {
        renderTrashGrid();
        modalTrash.classList.remove('hidden');
        modalTrash.classList.add('flex');
      });

      // Open Albums Modal
      document.getElementById('btnOpenAlbums').addEventListener('click', () => {
        renderAlbumTabs();
        renderAlbumGrid();
        modalAlbums.classList.remove('hidden');
        modalAlbums.classList.add('flex');
      });

      // Close buttons
      document.querySelectorAll('.btnCloseModal').forEach(btn => {
        btn.addEventListener('click', () => {
          modalTrash.classList.add('hidden');
          modalAlbums.classList.add('hidden');
        });
      });

      // Trash Actions
      document.getElementById('btnRestoreAll').addEventListener('click', () => {
        photos.forEach(p => { if (p.isDeleted) p.isDeleted = false; });
        renderTrashGrid();
        renderStack();
        showToast('已還原所有刪除照片', 'fa-rotate-left', 'text-emerald-400');
      });

      document.getElementById('btnClearTrash').addEventListener('click', () => {
        photos = photos.filter(p => !p.isDeleted);
        renderTrashGrid();
        renderStack();
        showToast('已永久刪除回收桶照片', 'fa-trash-can', 'text-rose-400');
      });
    }

    // --- Render Trash Grid Modal ---
    function renderTrashGrid() {
      const grid = document.getElementById('trashGrid');
      grid.innerHTML = '';
      const trashPhotos = photos.filter(p => p.isDeleted);

      if (trashPhotos.length === 0) {
        grid.innerHTML = `
          <div class="col-span-3 py-16 text-center text-slate-500">
            <i class="fa-solid fa-trash-can text-3xl mb-2 opacity-40"></i>
            <p class="text-xs">回收桶為空</p>
          </div>
        `;
        return;
      }

      trashPhotos.forEach(photo => {
        const item = document.createElement('div');
        item.className = 'relative aspect-square rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 group';
        item.innerHTML = `
          <img src="${photo.url}" class="w-full h-full object-cover">
          <button title="還原" class="btnRestoreSingle absolute inset-0 bg-slate-950/70 opacity-0 group-hover:opacity-100 transition flex flex-col items-center justify-center text-white text-xs font-bold space-y-1">
            <i class="fa-solid fa-rotate-left text-base text-emerald-400"></i>
            <span>點擊還原</span>
          </button>
        `;

        item.querySelector('.btnRestoreSingle').addEventListener('click', () => {
          photo.isDeleted = false;
          renderTrashGrid();
          renderStack();
          showToast('已還原 1 張照片', 'fa-rotate-left', 'text-emerald-400');
        });

        grid.appendChild(item);
      });
    }

    // --- Render Albums Tabs & Grid Modal ---
    function renderAlbumTabs() {
      const container = document.getElementById('albumTabs');
      container.innerHTML = '';

      albums.forEach(album => {
        const count = photos.filter(p => p.albumId === album.id && !p.isDeleted).length;
        const active = selectedAlbumTab === album.id;
        
        const tab = document.createElement('button');
        tab.className = `px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 flex-shrink-0 ${
          active 
            ? 'bg-indigo-600 text-white shadow-md' 
            : 'glass-btn text-slate-400 hover:text-white'
        }`;
        tab.innerHTML = `
          <span>${album.name}</span>
          <span class="px-1.5 py-0.5 rounded-full text-[10px] bg-slate-950/40">${count}</span>
        `;

        tab.addEventListener('click', () => {
          selectedAlbumTab = album.id;
          renderAlbumTabs();
          renderAlbumGrid();
        });

        container.appendChild(tab);
      });
    }

    function renderAlbumGrid() {
      const grid = document.getElementById('albumGrid');
      grid.innerHTML = '';

      const categoryPhotos = photos.filter(p => p.albumId === selectedAlbumTab && !p.isDeleted);

      if (categoryPhotos.length === 0) {
        grid.innerHTML = `
          <div class="col-span-3 py-16 text-center text-slate-500">
            <i class="fa-regular fa-folder-open text-3xl mb-2 opacity-40"></i>
            <p class="text-xs">此相簿尚未有照片</p>
          </div>
        `;
        return;
      }

      categoryPhotos.forEach(photo => {
        const item = document.createElement('div');
        item.className = 'relative aspect-square rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 group';
        item.innerHTML = `
          <img src="${photo.url}" class="w-full h-full object-cover">
          <button title="移出相簿" class="btnUnassign absolute inset-0 bg-slate-950/70 opacity-0 group-hover:opacity-100 transition flex flex-col items-center justify-center text-white text-xs font-bold space-y-1">
            <i class="fa-solid fa-arrow-up-from-bracket text-base text-indigo-400"></i>
            <span>移出相簿</span>
          </button>
        `;

        item.querySelector('.btnUnassign').addEventListener('click', () => {
          photo.albumId = null;
          renderAlbumTabs();
          renderAlbumGrid();
          renderStack();
          showToast('已將照片移回整理佇列', 'fa-arrow-up-from-bracket', 'text-indigo-400');
        });

        grid.appendChild(item);
      });
    }
  </script>
</body>
</html>
